<!-- 出错兜底：任何脚本报错都直接在页面上显示出来，而不是留一片白屏 -->
<script>
window.__mgFatal = function (err) {
  var msg = (err && (err.stack || err.message)) || String(err || '未知错误');
  if (window.console) console.error('[数学星图]', err);
  var show = function () {
    if (document.getElementById('mg-fatal')) return;
    var box = document.createElement('div');
    box.id = 'mg-fatal';
    box.style.cssText = 'position:fixed;left:16px;right:16px;bottom:16px;max-height:50vh;' +
      'overflow:auto;z-index:99;background:#fff;border:1px solid rgba(200,60,60,.35);' +
      'border-left:3px solid #D0483C;border-radius:10px;padding:14px 16px;' +
      'box-shadow:0 12px 40px rgba(0,0,0,.16);white-space:pre-wrap;' +
      'font:12.5px/1.6 ui-monospace,Menlo,Consolas,monospace;color:#3a2020';
    box.textContent = '数学星图出错了（多半是某个内容包写错了）：\n\n' + msg;
    document.body.appendChild(box);
  };
  if (document.body) show(); else document.addEventListener('DOMContentLoaded', show);
};
window.addEventListener('error', function (e) {
  // 资源（图片/字体）加载失败不算，只管脚本本身的错误
  if (e.target && e.target !== window && e.target.tagName) return;
  window.__mgFatal(e.error || e.message || '脚本执行出错');
}, true);
</script>

<!-- ===== 底部：页面标题 + 说明 + 操作提示 =====
     ⚠️ 这一块**必须保持可读**（不能 display:none，也不能靠 sr-only 藏起来）：
        /mathgalaxy/ 是 2.6 MB 的单文件应用，正文全在 JS 字符串里，渲染完页面上
        只有 97 个字符的可见文本 —— 搜索引擎读不到任何内容，整页等于空壳，
        所以这个 URL 至今没被任何搜索引擎收录（实测 site: 查不到）。
        这里是页面上唯一的静态可读内容，也是通往 706 个概念页与阅读页的入口。
     ⚠️ 首页（/）有它自己的内容，**替代不了这里** —— 搜索引擎按 URL 分别索引，
        而别人分享的链接正是这个 /mathgalaxy/。
     关于折叠：说明用 <details open>，默认展开 ⇒ 爬虫读到的就是展开状态；
        普通内容折叠（accordion）是标准做法，不属于「隐藏文本」。
        ⛔ 但 h1 不参与折叠，它永远可见。 -->
<div id="hint" class="floating">
  <h1>数学星图 MathGalaxy</h1>
  <details open>
    <summary>这是什么 · 怎么用</summary>
    <p class="hint-lead">把数学概念（公理 / 定义 / 定理 / 引理 / 命题）按「星系 / 星团 / 恒星」
    三层组织成一张可交互的依赖图 —— 箭头是推出，黑线是等价，蓝线是定义引用，紫色虚线是跨领域类比。</p>
    <p class="hint-keys">拖拽平移 · 滚轮 / 双指缩放 · 点击节点聚焦 · 点击连线看推导 · 聚焦后 ←→ 沿边游走
    ｜ <a href="all.html">全部概念索引</a> · <a href="questions.html">常见问法</a> · <a href="read.html">读图指南</a> · <a href="llms.txt">检索协议</a></p>
  </details>
</div>
