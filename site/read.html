<script>
/* 阅读页只做三件事：按 hash 切换文档、给每块内容排错峰进场的延迟、更新顶栏的「原文」链接。
   正文是构建期就渲染好的静态 HTML —— 打开即读，不依赖任何脚本。 */
(function () {
  var SITE = document.documentElement.dataset.site || '';
  var secs = [].slice.call(document.querySelectorAll('.doc'));
  var navs = [].slice.call(document.querySelectorAll('.side a'));
  var raw = document.getElementById('raw');
  var ids = secs.map(function (s) { return s.id; });

  function target() {
    var h = location.hash.replace(/^#/, '');
    return ids.indexOf(h) >= 0 ? h : ids[0];
  }

  // 重放进场动画：先摘掉 .run，强制一次重排，再挂回去
  function replay(sec) {
    var els = [].slice.call(sec.querySelectorAll('.stag'));
    els.forEach(function (el) { el.classList.remove('run'); });
    void sec.offsetWidth;
    els.forEach(function (el, i) {
      el.style.animationDelay = Math.min(i, 12) * 45 + 'ms';
      el.classList.add('run');
    });
  }

  function show(id, first) {
    secs.forEach(function (s) {
      s.classList.toggle('on', s.id === id);
      var h = s.querySelector('h1');
      if (h) h.style.viewTransitionName = '';   // doc-hero 同时只能有一个主人
    });
    navs.forEach(function (a) {
      a.setAttribute('aria-current', a.getAttribute('href') === '#' + id ? 'true' : 'false');
    });
    var sec = document.getElementById(id);
    var h1 = sec.querySelector('h1');
    if (h1) h1.style.viewTransitionName = 'doc-hero';
    if (raw) raw.href = sec.dataset.raw;
    document.title = sec.dataset.title + ' · ' + SITE;
    replay(sec);
    if (!first) window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', function () { show(target(), false); });
  show(target(), true);
})();
</script>
