        ends = [dn.id, un.id];
        return { edge: e, quads: quads, polys: polys, arrow: null, glyph: null, ends: ends };

      }

      if (e.kind === 'equivalence' || e.kind === 'analogy') {
        var na = byId[e.a], nb = byId[e.b];
        if (!na || !nb) return null;
        var Pa = screenOf(na), Pb = screenOf(nb);
        var r1 = nodeRadius(na), r2 = nodeRadius(nb);
        var q = trimTo(Pa, Pb, r1 + 1.5);
        var w = trimTo(Pb, Pa, r2 + 1.5);
        var seg = [{ x: q.x, y: q.y }, { x: w.x, y: w.y }];
        polys.push(seg);
        if (e.kind === 'equivalence') {
          glyph = { x: (q.x + w.x) / 2, y: (q.y + w.y) / 2, text: '⟺' };
        }
        ends = [e.a, e.b];
        return { edge: e, quads: [], polys: polys, arrow: null, glyph: glyph, ends: ends };
      }

      /* implication */
      var tg = byId[e.target];
      if (!tg) return null;
      var srcs = e.sources.map(function (id) { return byId[id]; }).filter(Boolean);
      if (!srcs.length) return null;
      var Pt = screenOf(tg), rt = nodeRadius(tg);
      var wc = { x: 0, y: 0 };

      if (srcs.length === 1) {
        var s0 = screenOf(srcs[0]);
        var rs0 = nodeRadius(srcs[0]);
        var dir = trimTo(Pt, s0, rt + 5);              // 从目标朝源方向退开
        var back = trimTo(s0, Pt, rs0 + 1.5);
        polys.push([{ x: back.x, y: back.y }, { x: dir.x, y: dir.y }]);
        arrow = { x: dir.x, y: dir.y, angle: Math.atan2(-dir.uy, -dir.ux) };
        ends = [srcs[0].id, tg.id];
      } else {
        // 多前提：先汇聚到一点，再射向结论
        srcs.forEach(function (s) { var p = screenOf(s); wc.x += p.x; wc.y += p.y; });
        wc.x /= srcs.length; wc.y /= srcs.length;
        var ddx = wc.x - Pt.x, ddy = wc.y - Pt.y;
        var dl = Math.sqrt(ddx * ddx + ddy * ddy) || 1;
        var off = Math.min(C.edge.mergeOffset * cam.k, dl * 0.45);
        var J = { x: Pt.x + (ddx / dl) * off, y: Pt.y + (ddy / dl) * off };
        srcs.forEach(function (s) {
          var Ps = screenOf(s), rsp = nodeRadius(s);
          var st = trimTo(Ps, J, rsp + 1.5);
          var en = trimTo(J, Ps, 7);
          polys.push([{ x: st.x, y: st.y }, { x: en.x, y: en.y }]);
          ends.push(s.id);
        });
        var tip = trimTo(Pt, J, rt + 5);
        polys.push([{ x: J.x, y: J.y }, { x: tip.x, y: tip.y }]);
        arrow = { x: tip.x, y: tip.y, angle: Math.atan2(-tip.uy, -tip.ux) };
        ends.push(tg.id);
      }
      return { edge: e, quads: quads, polys: polys, arrow: arrow, glyph: null, ends: ends };
    }

    /* -------------------------------------------------------- 可见性权重 */
    /** 返回 0~1：聚焦模式下不相关的节点/边会被压暗 */
    function dimNode() { return C.focus.hideUnrelated ? 0 : C.focus.dimNodeAlpha; }
    function dimEdge() { return C.focus.hideUnrelated ? 0 : C.focus.dimEdgeAlpha; }

    function alphaForNode(id) {
      var f = view.focus;
      if (!f) return 1;
      if (f.type === 'node') return (id === f.id || isNeighbor(id, f.id)) ? 1 : dimNode();
      if (f.type === 'edge') {
        var e = edgeById(f.id);
        return (e && GU.edgeNodes(e).indexOf(id) >= 0) ? 1 : dimNode();
      }
      return 1;
    }

    function alphaForEdge(e) {
      var f = view.focus;
      if (!f) return 1;
      if (f.type === 'node') return GU.edgeNodes(e).indexOf(f.id) >= 0 ? 1 : dimEdge();
      if (f.type === 'edge') return e.id === f.id ? 1 : dimEdge();
      return 1;
    }

    function isNeighbor(id, of) {
      var adj = view.graph.adj[of];
      return !!adj && adj.indexOf(id) >= 0;
    }

    function edgeById(id) {
      for (var i = 0; i < view.visible.length; i++) if (view.visible[i].id === id) return view.visible[i];
      return null;
    }

    /* ============================================================ 绘制 */
    function draw() {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);

      var geoms = buildGeometry();
      var cam = view.cam;
      computeLod();

      /* ---------- 0. 星团级粗线（缩小时才出现，整块对整块） ---------- */
      drawClusterLinks();

      /* ---------- 1. 节点级连线 ---------- */
      var defs = [], eqs = [], imps = [], anas = [];
      geoms.forEach(function (g) {
        if (g.edge.kind === 'definition') defs.push(g);
        else if (g.edge.kind === 'equivalence') eqs.push(g);
        else if (g.edge.kind === 'analogy') anas.push(g);
        else imps.push(g);
      });

      drawEdges(anas);          // 弱边垫在最底下（平时几乎看不见）
      drawEdges(defs);
      drawEdges(eqs);
      drawEdges(imps);
      geoms.forEach(function (g) { if (g.arrow) drawArrow(g); });

      /* ---------- 2. 节点 ---------- */
      if (lodA.nodeDot > 0.02) {
        view.graph.nodes.forEach(function (n) { drawNode(n); });
      }

      /* ---------- 3. 名称（星系名 → 星团名 → 节点名，逐层交接） ---------- */
      if (lodA.galaxyName > 0.02) drawGalaxyNames();
      if (lodA.clusterName > 0.02) drawClusterNames();
      if (C.showLabels) drawLabels();
    }

    /* ------------------------------------------------ 星系名 */
    function drawGalaxyNames() {
      var a = lodA.galaxyName;
      var fs = U.clamp(15 * Math.pow(view.cam.k, 0.30), 13, 34);
      ctx.save();
      ctx.font = '700 ' + fs.toFixed(1) + 'px ' + T.font;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      (view.graph.regions || []).forEach(function (r) {
        if (!r.stat || !r.name) return;
        var p = view.cam.toScreen(r.stat.cx, r.stat.cy);
        if (p.x < -300 || p.x > W + 300 || p.y < -200 || p.y > H + 200) return;
        var text = r.name;
        var tw = ctx.measureText(text).width;
        var ls = fs * 0.18;
        var bw = tw + ls * (text.length - 1) + 26, bh = fs + 14;
        ctx.globalAlpha = a;
        ctx.fillStyle = 'rgba(255,255,255,0.86)';
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(p.x - bw / 2, p.y - bh / 2, bw, bh, bh / 2);
        else ctx.rect(p.x - bw / 2, p.y - bh / 2, bw, bh);
        ctx.fill();
        ctx.strokeStyle = U.rgba(r.color, 0.55);
        ctx.lineWidth = 1.5;
        ctx.stroke();
        // 手动加字距
        var chars = text.split('');
        var total = tw + ls * (chars.length - 1);
        var cx = p.x - total / 2;
        ctx.fillStyle = 'rgba(26,28,34,0.92)';
        ctx.textAlign = 'left';
        chars.forEach(function (ch) {
          ctx.fillText(ch, cx, p.y + 0.5);
          cx += ctx.measureText(ch).width + ls;
        });
        ctx.textAlign = 'center';
        ctx.globalAlpha = 1;
      });
      ctx.restore();
    }

    /* ------------------------------------------------ 星团级连线 */
    function drawClusterLinks() {
      var a = lodA.clusterLink;
      if (a <= 0.02) return;
      var links = view.graph.clusterLinks || [];
      if (!links.length) return;
      var cfgL = C.clusterLink;
      var maxCount = 1;
      links.forEach(function (l) { if (l.count > maxCount) maxCount = l.count; });

      ctx.save();
      ctx.lineCap = 'round';
      links.forEach(function (l) {
        if (l.count < cfgL.minEdges) return;
        var A = view.graph.clusterById[l.a], B = view.graph.clusterById[l.b];
        if (!A || !B || !A.stat || !B.stat) return;
        var p0 = view.cam.toScreen(A.stat.cx, A.stat.cy);
        var p1 = view.cam.toScreen(B.stat.cx, B.stat.cy);
        var len = U.dist(p0.x, p0.y, p1.x, p1.y);
        if (len < 2) return;
        var t = Math.min(1, l.count / Math.max(2, maxCount));
        var w = U.lerp(cfgL.widthMin, cfgL.widthMax, Math.sqrt(t)) * Math.min(1.4, Math.max(0.6, view.cam.k));
        var bend = (l.a < l.b ? 1 : -1) * len * cfgL.curve;
        var ctl = U.perpControl(p0.x, p0.y, p1.x, p1.y, bend);
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y);
        ctx.quadraticCurveTo(ctl.x, ctl.y, p1.x, p1.y);
        ctx.lineWidth = w;
        ctx.strokeStyle = 'rgba(' + cfgL.color + ',' + (cfgL.alpha * a).toFixed(3) + ')';
        ctx.stroke();
      });
      ctx.restore();
    }

    /* ------------------------------------------------ 星团名 */
    function drawClusterNames() {
      var a = lodA.clusterName;
      var fs = U.clamp(C.cluster.labelSize * Math.pow(view.cam.k, 0.42), 11, 26);
      ctx.save();
      ctx.font = '700 ' + fs.toFixed(1) + 'px ' + T.font;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      (view.graph.clusters || []).forEach(function (c) {
        if (!c.stat || !c.name) return;
        var p = view.cam.toScreen(c.stat.cx, c.stat.cy);
        if (p.x < -300 || p.x > W + 300 || p.y < -200 || p.y > H + 200) return;
        var text = c.name;
        var tw = ctx.measureText(text).width;
        var pad = C.cluster.namePad;
        var bw = tw + pad * 2, bh = fs + 9;
        ctx.globalAlpha = a;
        ctx.fillStyle = 'rgba(255,255,255,0.88)';
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(p.x - bw / 2, p.y - bh / 2, bw, bh, bh / 2);
        else ctx.rect(p.x - bw / 2, p.y - bh / 2, bw, bh);
        ctx.fill();
        var g = view.graph.galaxyOf(c);
        if (g) { ctx.strokeStyle = U.rgba(g.color, 0.5); ctx.lineWidth = 1.2; ctx.stroke(); }
        // 深色字，保证在云上读得清
        ctx.fillStyle = 'rgba(30,32,40,0.90)';
        ctx.fillText(text, p.x, p.y + 0.5);
        ctx.globalAlpha = 1;
      });
      ctx.restore();
    }

    function drawEdges(list) {
      list.forEach(function (g) {
        var e = g.edge;
        var style = T.edgeStyles[e.kind];
        var a = alphaForEdge(e) * lodA.nodeEdge;
        if (a <= 0.02) return;

        var active = isEdgeActive(g);
        var w = (e.kind === 'implication' ? C.edge.implicationWidth
          : e.kind === 'equivalence' ? C.edge.equivalenceWidth
            : e.kind === 'analogy' ? T.edgeStyles.analogy.width
              : C.edge.definitionWidth) * (active ? 1.85 : 1);

        if (e.kind === 'definition' && !C.showDefinitionLines) return;

        // 弱边：不开探索模式时压得很淡，开了才提亮
        var isWeak = GU.isWeak(e);
        if (isWeak) {
          var base = C.exploreMode ? C.analogy.exploreAlpha : C.analogy.dimAlpha;
          a = a * (base / (style.alpha || 1));
          if (a <= 0.02) return;
          w *= active ? 1.6 : 1;
        }

        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineWidth = w;
        if (isWeak) ctx.setLineDash(C.analogy.dash);

        if (e.kind === 'definition' || e.kind === 'analogy') {
          var alpha = (style.alpha != null ? style.alpha : 1) * a;
          ctx.strokeStyle = 'rgba(' + style.color + ',' + alpha.toFixed(3) + ')';
        } else {
          ctx.strokeStyle = U.rgba(style.color, a);
        }

        ctx.beginPath();
        g.polys.forEach(function (pts, i) {
          if (g.quads[i]) {
            var q = g.quads[i];
            ctx.moveTo(q.p0.x, q.p0.y);
            ctx.quadraticCurveTo(q.p1.x, q.p1.y, q.p2.x, q.p2.y);
          } else {
            ctx.moveTo(pts[0].x, pts[0].y);
            for (var k = 1; k < pts.length; k++) ctx.lineTo(pts[k].x, pts[k].y);
          }
        });
        ctx.stroke();

        // 等价线中点画一个 ⟺（用白色描边做底，而不是白方块，免得在云上留个补丁）
        if (g.glyph && cam_eqVisible()) {
          ctx.font = '600 ' + Math.round(U.clamp(13 * Math.pow(view.cam.k, 0.4), 11, 18)) + 'px ' + T.font;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.lineWidth = 3.5;
          ctx.strokeStyle = 'rgba(255,255,255,' + (0.95 * a).toFixed(3) + ')';
          ctx.strokeText(g.glyph.text, g.glyph.x, g.glyph.y + 0.5);
          ctx.fillStyle = U.rgba(T.edgeStyles.equivalence.color, 0.92 * a);
          ctx.fillText(g.glyph.text, g.glyph.x, g.glyph.y + 0.5);
        }
        ctx.restore();
      });
    }

    function cam_eqVisible() { return view.cam.k >= C.edge.equivalenceGlyph; }

    function isEdgeActive(g) {
      var e = g.edge;
      if (view.hover && view.hover.type === 'edge' && view.hover.id === e.id) return true;
      if (view.focus && view.focus.type === 'edge' && view.focus.id === e.id) return true;
      if (view.focus && view.focus.type === 'node' && GU.edgeNodes(e).indexOf(view.focus.id) >= 0) return true;
      if (view.hover && view.hover.type === 'node' && GU.edgeNodes(e).indexOf(view.hover.id) >= 0) return true;
      return false;
    }

    function drawArrow(g) {
      var e = g.edge;
      var a = alphaForEdge(e) * lodA.nodeEdge;
      if (a <= 0.02) return;
      var sz = U.clamp(C.edge.arrowSize * Math.pow(view.cam.k, 0.35), 6, 17) * (isEdgeActive(g) ? 1.2 : 1);
      var x = g.arrow.x, y = g.arrow.y, ang = g.arrow.angle;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(ang);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-sz, sz * 0.42);
      ctx.lineTo(-sz * 0.72, 0);
      ctx.lineTo(-sz, -sz * 0.42);
      ctx.closePath();
      ctx.fillStyle = U.rgba(T.edgeStyles.implication.color, a);
      ctx.fill();
      ctx.restore();
    }

    /* ---------------------------------------------------------- 节点 */
    function drawNode(n) {
      var p = screenOf(n);
      var r = nodeRadius(n);
      var a = alphaForNode(n.id) * lodA.nodeDot;
      if (a <= 0.02) return;

      var st = MG.typeStyle(n.type);
      var isFocus = view.focus && view.focus.type === 'node' && view.focus.id === n.id;
      var isHover = (view.hover && view.hover.type === 'node' && view.hover.id === n.id) ||
        (view.hover && view.hover.type === 'edge' && edgeById(view.hover.id) &&
          GU.edgeNodes(edgeById(view.hover.id)).indexOf(n.id) >= 0);

      // 光晕
      if (C.node.glow) {
        var gs = glowSprite(st.color);
        var gsz = r * 5.4;
        ctx.globalAlpha = a * (isFocus || isHover ? 1 : 0.72);
        ctx.drawImage(gs, p.x - gsz / 2, p.y - gsz / 2, gsz, gsz);
        ctx.globalAlpha = 1;
      }

      // 实心点 + 白圈
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fillStyle = U.rgba(st.color, a);
      ctx.fill();
      ctx.lineWidth = Math.max(1.2, C.node.ringWidth * Math.min(1, view.cam.k + 0.35));
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.95 * a).toFixed(3) + ')';
      ctx.stroke();

      // 选中 / 悬停的外环
      if (isFocus || isHover) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, r + 5.5, 0, Math.PI * 2);
        ctx.lineWidth = isFocus ? 2 : 1.4;
        ctx.strokeStyle = U.rgba(st.color, (isFocus ? 0.95 : 0.55) * a);
        ctx.stroke();
      }
    }

    /* ---------------------------------------------------------- 名称 */
    function drawLabels() {
      var k = view.cam.k;
      var fs = labelFont();
      if (lodA.nodeName <= 0.02) { drawKeyLabels(fs); return; }

      // 缩得很小时只留「重要」节点的名字；重叠的名字一律让位（永远去重叠）
      var keepAll = k >= C.node.labelMinZoomAll;
      var placed = [];
      var nodes = view.graph.nodes.slice().sort(function (a, b) {
        return labelPriority(b) - labelPriority(a);
      });

      ctx.font = '600 ' + fs + 'px ' + T.font;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';

      nodes.forEach(function (n) {
        var a = alphaForNode(n.id);
        var isSpecial = (view.focus && view.focus.id === n.id) ||
          (view.hover && view.hover.type === 'node' && view.hover.id === n.id);
        if (a <= 0.06) return;
        if (!keepAll && !isSpecial && n.degree < 3) return;

        var p = screenOf(n);
        var r = nodeRadius(n);
        var text = n.label;
        var tw = measure(ctx, text, ctx.font);
        var x = p.x, y = p.y + r + C.node.labelOffset * Math.max(k, 0.62);
        var box = { x0: x - tw / 2 - C.node.labelPad, y0: y - 1, x1: x + tw / 2 + C.node.labelPad, y1: y + fs + 2 };

        if (!isSpecial) {
          var hit = false;
          for (var i = 0; i < placed.length; i++) {
            var b = placed[i];
            if (box.x0 < b.x1 && box.x1 > b.x0 && box.y0 < b.y1 && box.y1 > b.y0) { hit = true; break; }
          }
          if (hit) return;
        }
        placed.push(box);

        var alpha = a * (isSpecial ? 1 : 0.92 * lodA.nodeName);
        ctx.lineWidth = Math.max(2.5, fs * 0.28);
        ctx.strokeStyle = 'rgba(255,255,255,' + (0.9 * alpha).toFixed(3) + ')';
        ctx.strokeText(text, x, y);
        ctx.fillStyle = isSpecial ? U.rgba(MG.typeStyle(n.type).color, alpha) : 'rgba(28,28,30,' + alpha.toFixed(3) + ')';
        ctx.fillText(text, x, y);
      });
    }

    /** 缩得太小时只画关键节点的名字 */
    function drawKeyLabels(fs) {
      var special = [];
      if (view.focus && view.focus.type === 'node') special.push(view.focus.id);
      if (view.hover && view.hover.type === 'node') special.push(view.hover.id);
      if (!special.length) return;
      ctx.font = '600 ' + Math.max(fs, 12) + 'px ' + T.font;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      special.forEach(function (id) {
        var n = view.graph.byId[id];
        if (!n) return;
        var p = screenOf(n), r = nodeRadius(n);
        var y = p.y + r + 10;
        ctx.lineWidth = 3;
        ctx.strokeStyle = T.labelHalo;
        ctx.strokeText(n.label, p.x, y);
        ctx.fillStyle = T.ink;
        ctx.fillText(n.label, p.x, y);
      });
    }

    function labelPriority(n) {
      var s = n.degree * 10;
      if (view.focus && view.focus.id === n.id) s += 1000;
      if (view.hover && view.hover.id === n.id) s += 800;
      if (n.type === 'definition') s -= 6;
      return s;
    }

    /* ========================================================== 命中检测 */
    function hitTest(sx, sy) {
      ensureGeom();
      // 先节点
      var best = null, bestD = Infinity;
      view.graph.nodes.forEach(function (n) {
        var a = alphaForNode(n.id);
        if (a <= 0.06) return;
        var p = screenOf(n);
        var r = nodeRadius(n) + 9;      // 给触摸留点余量
        var d = U.dist(sx, sy, p.x, p.y);
        if (d <= r && d < bestD) { bestD = d; best = { type: 'node', id: n.id }; }
      });
      if (best) return best;

      // 再连线
      var tol = C.edge.hitTolerance;
      var list = geomCache ? Object.keys(geomCache).map(function (k) { return geomCache[k]; }) : [];
      var hitEdge = null, hitD = Infinity;
      list.forEach(function (g) {
        if (g.edge.kind === 'definition' && !C.showDefinitionLines) return;
        // 弱边没开探索模式时不响应点击（它本来就几乎看不见）
        if (GU.isWeak(g.edge) && !C.exploreMode) return;
        var a = alphaForEdge(g.edge);
        if (a <= 0.06) return;
        g.polys.forEach(function (pts) {
          var d = U.pointPolylineDist(sx, sy, pts);
          if (d < tol && d < hitD) { hitD = d; hitEdge = g.edge.id; }
        });
        if (g.arrow) {
          var d2 = U.dist(sx, sy, g.arrow.x, g.arrow.y);
          if (d2 < tol + 6 && d2 < hitD) { hitD = d2; hitEdge = g.edge.id; }
        }
      });
      return hitEdge ? { type: 'edge', id: hitEdge } : null;
    }

    function invalidate() { geomCache = null; }

    return {
      resize: resize,
      draw: draw,
      hitTest: hitTest,
      invalidate: invalidate,
      nodeRadius: nodeRadius,
      screenOf: screenOf,
      get size() { return { w: W, h: H }; }
    };
  }

  MG.createRenderer = createRenderer;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ==========================================================================
   数学星图 · 交互
   --------------------------------------------------------------------------
   · 拖拽平移
   · 滚轮缩放（可在工具条里切成「滚轮平移」，照顾触控板）
   · 双指捏合缩放 + 双指拖动
   · 悬停高亮、点击选中
   命中检测交给 renderer（节点 → 优先；连线 → 次之）。
   ========================================================================== */
(function (global) {
  'use strict';
  var MG = (global.MG = global.MG || {});
  var U = MG.util;
  var C = MG.config;

  function createInteraction(canvas, view, hooks) {
    var pointers = new Map();
    var mode = 'idle';
    var downAt = null;       // 屏幕坐标
    var downTime = 0;
    var moved = false;
    var lastPinch = null;
    var hoverDirty = false;
    var rafPending = false;

    function localPos(e) {
      var r = canvas.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }

    function requestDraw() {
      if (rafPending) return;
      rafPending = true;
      requestAnimationFrame(function () { rafPending = false; hooks.draw(); });
    }

    /* ------------------------------------------------------- 指针按下 */
    function onPointerDown(e) {
      if (e.button != null && e.button !== 0 && e.pointerType === 'mouse') return;
      canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
      var p = localPos(e);
      pointers.set(e.pointerId, p);
      view.cam.stopAnimation();

      if (pointers.size === 1) {
        mode = 'pan';
        downAt = p;
        lastPoint = p;           // 平移增量的基准点
        downTime = performance.now ? performance.now() : Date.now();
        moved = false;
      } else if (pointers.size === 2) {
        mode = 'pinch';
        moved = true;
        lastPinch = pinchState();
      }
      requestDraw();
    }

    function pinchState() {
      var pts = Array.from(pointers.values());
      if (pts.length < 2) return null;
      var a = pts[0], b = pts[1];
      return {
        d: Math.max(1, U.dist(a.x, a.y, b.x, b.y)),
        cx: (a.x + b.x) / 2,
        cy: (a.y + b.y) / 2
      };
    }

    /* ------------------------------------------------------- 指针移动 */
    function onPointerMove(e) {
      var p = localPos(e);

      if (pointers.has(e.pointerId)) pointers.set(e.pointerId, p);

      if (mode === 'pinch' && pointers.size >= 2) {
        var now = pinchState();
        if (lastPinch && now) {
          view.cam.panBy(now.cx - lastPinch.cx, now.cy - lastPinch.cy);
          view.cam.zoomBy(now.d / lastPinch.d, now.cx, now.cy);
          lastPinch = now;
        }
        requestDraw();
        scheduleHover(p);
        return;
      }

      if (mode === 'pan' && pointers.size === 1 && pointers.has(e.pointerId)) {
        var dx = p.x - lastPoint.x, dy = p.y - lastPoint.y;
        if (!moved && Math.abs(p.x - downAt.x) + Math.abs(p.y - downAt.y) > 4) {
          moved = true;
          canvas.classList.add('dragging');
        }
        if (moved) { view.cam.panBy(dx, dy); lastPoint = p; requestDraw(); }
        return;
      }

      scheduleHover(p);
    }

    var lastPoint = { x: 0, y: 0 };
    var hoverPos = { x: 0, y: 0 };

    function scheduleHover(p) {
      hoverPos = p;
      if (hoverDirty) return;
      hoverDirty = true;
      requestAnimationFrame(function () {
        hoverDirty = false;
        if (mode === 'pinch') return;
        if (mode === 'pan' && moved) { applyHover(null); return; }  // 拖拽时不谈悬停
        var hit = hooks.hitTest(hoverPos.x, hoverPos.y);
        applyHover(hit);
      });
    }

    function applyHover(hit) {
      var cur = view.hover;
      var same = (cur == null && hit == null) ||
        (cur && hit && cur.type === hit.type && cur.id === hit.id);
      canvas.classList.toggle('pointing', !!hit);
      if (same) return;
      view.hover = hit;
      hooks.onHover && hooks.onHover(hit);
      requestDraw();
    }

    /* ------------------------------------------------------- 指针抬起 */
    function onPointerUp(e) {
      var p = localPos(e);
      var wasMode = mode;
      pointers.delete(e.pointerId);
      canvas.releasePointerCapture && canvas.releasePointerCapture(e.pointerId);

      if (pointers.size === 0) {
        canvas.classList.remove('dragging');
        if (mode === 'pan' && !moved) {
          var dt = (performance.now ? performance.now() : Date.now()) - downTime;
          if (dt < 700) {
            var hit = hooks.hitTest(p.x, p.y);
            hooks.onPick && hooks.onPick(hit);
          }
        }
        mode = 'idle';
        lastPinch = null;
        scheduleHover(p);
      } else if (pointers.size === 1) {
        mode = 'pan';
        lastPoint = Array.from(pointers.values())[0];
        downAt = lastPoint;
        moved = true;
        lastPinch = null;
      } else {
        mode = 'idle';
      }
      requestDraw();
      return wasMode;
    }

    function onPointerCancel(e) {
      pointers.delete(e.pointerId);
      if (pointers.size === 0) { mode = 'idle'; canvas.classList.remove('dragging'); }
      lastPinch = pinchState();
    }

    /* ------------------------------------------------------------ 滚轮 */
    function onWheel(e) {
      e.preventDefault();
      var p = localPos(e);
      var isPinch = e.ctrlKey || e.metaKey;   // 触控板捏合 → 浏览器给的是 ctrl+wheel
      var zoom = isPinch || C.wheelZooms;

      if (zoom) {
        // 归一化不同设备的 delta
        var unit = e.deltaMode === 1 ? 16 : (e.deltaMode === 2 ? 400 : 1);
        var d = e.deltaY * unit;
        var factor = Math.exp(-d * C.camera.wheelGain);
        view.cam.stopAnimation();
        if (view.cam.zoomBy(factor, p.x, p.y)) requestDraw();
      } else {
        var unit2 = e.deltaMode === 1 ? 16 : (e.deltaMode === 2 ? 400 : 1);
        view.cam.panBy(-e.deltaX * unit2, -e.deltaY * unit2);
        requestDraw();
      }
    }

    /* --------------------------------------------------------- 绑定 */
    canvas.addEventListener('pointerdown', onPointerDown);
    canvas.addEventListener('pointermove', onPointerMove);
    canvas.addEventListener('pointerup', onPointerUp);
    canvas.addEventListener('pointercancel', onPointerCancel);
    canvas.addEventListener('pointerleave', function () { applyHover(null); });
    canvas.addEventListener('wheel', onWheel, { passive: false });
    canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    return {
      destroy: function () {
        canvas.removeEventListener('pointerdown', onPointerDown);
        canvas.removeEventListener('pointermove', onPointerMove);
        canvas.removeEventListener('pointerup', onPointerUp);
        canvas.removeEventListener('pointercancel', onPointerCancel);
        canvas.removeEventListener('wheel', onWheel);
      }
    };
  }

  MG.createInteraction = createInteraction;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ==========================================================================
   数学星图 · 搜索
   --------------------------------------------------------------------------
   在左上角输入框里搜：节点名称 / 英文名 / id / 标签 / 陈述正文 / 板块名。
   键盘：↑ ↓ 选择，Enter 跳转，Esc 清空。
   ========================================================================== */
(function (global) {
  'use strict';
  var MG = (global.MG = global.MG || {});
  var U = MG.util;

  function createSearch(box, input, results, view, hooks) {
    var items = [];
    var active = -1;
    var open = false;

    /* --------------------------------------------------------- 建立索引 */
    var index = [];
    function reindex() {
      index = view.graph.nodes.map(function (n) {
        var regions = n.regions.map(function (r) {
          var reg = view.graph.regionById[r];
          return reg ? (reg.name + ' ' + (reg.en || '')) : r;
        }).join(' ');
        var st = U.plain(n.statement);
        var nt = U.plain(n.notes);
        var hay = [
          n.label, n.title, n.id, n.type, MG.typeStyle(n.type).name,
          (n.tags || []).join(' '), regions, st, nt
        ].join('\n').toLowerCase();
        return { node: n, hay: hay, label: n.label, title: n.title, st: st };
      });
    }

    /* ----------------------------------------------------------- 打分 */
    function score(entry, q) {
      var label = entry.label.toLowerCase();
      var title = entry.title.toLowerCase();
      var s = 0;
      if (label === q) s += 1000;
      if (label.indexOf(q) === 0) s += 500;
      if (label.indexOf(q) >= 0) s += 260;
      if (title.indexOf(q) >= 0) s += 150;
      if (entry.node.id.toLowerCase().indexOf(q) >= 0) s += 120;
      if ((entry.node.tags || []).join(' ').toLowerCase().indexOf(q) >= 0) s += 110;
      if (entry.node.type.toLowerCase().indexOf(q) >= 0) s += 60;
      var i = entry.hay.indexOf(q);
      if (i >= 0) s += 40;
      if (s > 0) s += Math.min(20, entry.node.degree || 0);
      return s;
    }

    function run(q) {
      q = q.trim().toLowerCase();
      items = [];
      if (!q) { render(); return; }

      var hits = [];
      index.forEach(function (e) { var s = score(e, q); if (s > 0) hits.push({ e: e, s: s }); });
      hits.sort(function (a, b) { return b.s - a.s; });
      hits.slice(0, 14).forEach(function (h) {
        items.push({ kind: 'node', id: h.e.node.id, label: h.e.label, sub: subOf(h.e), q: q, node: h.e.node });
      });

      // 板块也当作一种结果
      view.graph.regions.forEach(function (r) {
        if (!r.stat) return;
        if ((r.name + ' ' + (r.en || '')).toLowerCase().indexOf(q) >= 0) {
          items.push({ kind: 'region', id: r.id, label: r.name, sub: r.stat.count + ' 个节点', q: q });
        }
      });

      active = items.length ? 0 : -1;
      render();
    }

    function subOf(e) {
      var st = e.st || U.plain(e.title);
      return U.truncate(st || MG.typeStyle(e.node.type).name, 64);
    }

    function mark(text, q) {
      if (!q) return U.escapeHtml(text);
      var i = text.toLowerCase().indexOf(q);
      if (i < 0) return U.escapeHtml(text);
      return U.escapeHtml(text.slice(0, i)) + '<mark>' +
        U.escapeHtml(text.slice(i, i + q.length)) + '</mark>' +
        U.escapeHtml(text.slice(i + q.length));
    }

    function render() {
      if (!items.length) {
        var v = input.value.trim();
        results.innerHTML = v
          ? '<div class="sr-empty">没有找到「' + U.escapeHtml(v) + '」相关的节点</div>'
          : '';
        open = !!v;
      } else {
        results.innerHTML = items.map(function (it, i) {
          var color = it.kind === 'region'
            ? (view.graph.regionById[it.id] || {}).color || '#ccc'
            : MG.typeStyle(it.node.type).color;
          var tagText = it.kind === 'region' ? '板块' : MG.typeStyle(it.node.type).name;
          var regionName = '';
          if (it.kind === 'node' && it.node.regions.length) {
            var r0 = view.graph.regionById[it.node.regions[0]];
            if (r0) regionName = r0.name;
          }
          return '<div class="sr-item' + (i === active ? ' active' : '') + '" data-i="' + i + '">' +
            '<span class="sr-dot" style="background:' + color + '"></span>' +
            '<span class="sr-title">' + mark(it.label, it.q) + '</span>' +
            '<span class="sr-sub">' + U.escapeHtml(tagText) + ' · ' + U.escapeHtml(it.sub) + '</span>' +
            (regionName ? '<span class="sr-region">' + U.escapeHtml(regionName) + '</span>' : '<span class="sr-region">' + U.escapeHtml(tagText) + '</span>') +
            '</div>';
        }).join('');
        open = true;
      }
      results.classList.toggle('hidden', !open);
      box.classList.toggle('active', open);
    }

    function choose(i) {
      var it = items[i];
      if (!it) return;
      if (it.kind === 'region') hooks.onRegion && hooks.onRegion(it.id);
      else hooks.onNode && hooks.onNode(it.id);
      close();
    }

    function close() {
      open = false;
      active = -1;
      results.classList.add('hidden');
      box.classList.remove('active');
    }

    function clear() {
      input.value = '';
      items = [];
      close();
    }

    /* ---------------------------------------------------------- 事件 */
    input.addEventListener('input', function () { run(input.value); });
    input.addEventListener('focus', function () {
      box.classList.add('active');
      if (input.value.trim()) run(input.value);
    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        if (!items.length) return;
        e.preventDefault();
        active = (active + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
        open = true;
        render();
        var el = results.querySelector('.sr-item.active');
        if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'Enter') {
        e.preventDefault();
        choose(active < 0 ? 0 : active);
      } else if (e.key === 'Escape') {
        e.preventDefault();
        if (input.value) clear(); else { close(); input.blur(); }
      }
    });
    input.addEventListener('blur', function () { setTimeout(close, 140); });

    results.addEventListener('mousedown', function (e) {
      var el = e.target.closest ? e.target.closest('.sr-item') : null;
      if (!el) return;
      e.preventDefault();
      choose(parseInt(el.getAttribute('data-i'), 10));
    });

    document.addEventListener('mousedown', function (e) {
      if (!box.contains(e.target)) close();
    });

    return {
      reindex: reindex,
      clear: clear,
      close: close,
      focus: function () { input.focus(); input.select(); }
    };
  }

  MG.createSearch = createSearch;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ==========================================================================
   数学星图 · 详情面板
   --------------------------------------------------------------------------
   点节点 → 显示类型 / 板块 / 陈述 / 说明 + 相关连线（可点击跳转）
   点连线 → 显示推导过程（推出 / 等价 / 定义引用）
   ========================================================================== */
(function (global) {
  'use strict';
  var MG = (global.MG = global.MG || {});
  var U = MG.util;
  var T = MG.theme;
  var GU = MG.graphUtil;

  function createPanel(panelEl, bodyEl, closeBtn, view, hooks) {
    var current = null;

    function hide() {
      current = null;
      panelEl.classList.add('hidden');
      hooks.onClose && hooks.onClose();
    }

    function show(what) {
      current = what;
      panelEl.classList.remove('hidden');
      panelEl.scrollTop = 0;
      if (what.type === 'node') renderNode(view.graph.byId[what.id]);
      else renderEdge(findEdge(what.id));
    }

    function findEdge(id) {
      for (var i = 0; i < view.graph.edges.length; i++) if (view.graph.edges[i].id === id) return view.graph.edges[i];
      return null;
    }

    /* ------------------------------------------------------------ 零件 */
    function kindBadge(type) {
      var st = MG.typeStyle(type);
      return '<span class="pn-kind" style="background:' + st.color + '">' +
        '<span class="dot"></span>' + U.escapeHtml(st.name) + '</span>';
    }

    function regionChips(node) {
      if (!node.regions.length && !node.clusterObj) return '';
      var head = '';
      if (node.clusterObj) {
        var g = view.graph.galaxyOf ? view.graph.galaxyOf(node.clusterObj) : null;
        var col = node.clusterObj.color || (g ? g.color : '#8892A0');
        head = '<span class="pn-chip" data-cluster="' + node.clusterObj.id + '">' +
          '<span class="lg-swatch" style="background:' + U.mixWithWhite(col, 0.62) + '"></span>' +
          U.escapeHtml(node.clusterObj.name) + '</span>';
      }
      return '<div class="pn-regions">' + head + node.regions.map(function (rid) {
        var r = view.graph.regionById[rid];
        if (!r) return '';
        return '<span class="pn-chip" data-region="' + r.id + '">' +
          '<span class="lg-swatch" style="background:' + r.color + '"></span>' +
          U.escapeHtml(r.name) + '</span>';
      }).join('') + '</div>';
    }

    function nodeRow(n, prefix, keyword) {
      var st = MG.typeStyle(n.type);
      var desc = U.plain(n.statement) || U.plain(n.notes) || n.title;
      return '<div class="pn-link" data-kind="node" data-id="' + n.id + '">' +
        '<span class="dot" style="background:' + st.color + '"></span>' +
        (keyword ? '<span class="kw">' + U.escapeHtml(keyword) + '</span>' : '') +
        '<span><span class="nm">' + U.escapeHtml(n.label) + '</span>' +
        '<div class="ds">' + U.escapeHtml(U.truncate(desc, 56)) + '</div></span>' +
        '</div>';
    }

    function edgeRow(e, keyword) {
      var name = T.edgeNames[e.kind] || e.kind;
      var arrow = e.kind === 'implication' ? '⟹'
        : e.kind === 'equivalence' ? '⟺'
          : e.kind === 'analogy' ? '～' : '·';
      var head = e.title || shortLabel(e, 40);
      var snippet = '';
      if (e.proof) snippet = U.plain(e.proof);
      else if (e.proofs && e.proofs.length) snippet = e.proofs.map(function (p) { return p.label; }).join(' / ');
      else if (e.note) snippet = U.plain(e.note);
      return '<div class="pn-link" data-kind="edge" data-id="' + e.id + '">' +
        '<span class="dot" style="background:' + edgeDot(e) + '"></span>' +
        (keyword ? '<span class="kw">' + U.escapeHtml(keyword) + '</span>' : '') +
        '<span><span class="nm">' + U.escapeHtml(U.truncate(head, 44)) + '</span>' +
        '<div class="ds">' + arrow + ' ' + U.escapeHtml(name) +
        (snippet ? ' · ' + U.escapeHtml(U.truncate(snippet, 48)) : '') + '</div></span>' +
        '</div>';
    }

    function edgeDot(e) {
      if (e.kind === 'definition') return 'rgba(60,112,245,0.75)';
      if (e.kind === 'equivalence') return '#1C1C1E';
      return '#1C1C1E';
    }

    function shortLabel(e, n) {
      var g = view.graph;
      if (e.kind === 'analogy') {
        return U.truncate(lbl(g, e.a) + ' ～ ' + lbl(g, e.b), n);
      }
      if (e.kind === 'equivalence') {
        return U.truncate(lbl(g, e.a) + ' ⟺ ' + lbl(g, e.b), n);
      }
      if (e.kind === 'definition') {
        return U.truncate('「' + lbl(g, e.definition) + '」→ ' + lbl(g, e.usedBy), n);
      }
      var s = e.sources.map(function (id) { return lbl(g, id); }).join(' + ');
      return U.truncate(s + ' ⟹ ' + lbl(g, e.target), n);
    }

    function lbl(g, id) { var n = g.byId[id]; return n ? n.label : id; }

    function section(title, html) {
      return '<div class="pn-sec"><h4>' + U.escapeHtml(title) + '</h4>' + html + '</div>';
    }

    function listOrNone(rows, emptyText) {
      if (!rows.length) return '<div class="pn-none">' + U.escapeHtml(emptyText) + '</div>';
      return '<div class="pn-list">' + rows.join('') + '</div>';
    }

    /* -------------------------------------------------------- 节点面板 */
    function renderNode(n) {
      if (!n) { hide(); return; }
      var g = view.graph;
      var html = '';
      html += kindBadge(n.type);
      html += '<h1 class="pn-h1">' + U.escapeHtml(n.title) + '</h1>';
      html += '<div class="pn-h2">' + U.escapeHtml(n.id) + '</div>';
      html += regionChips(n);

      if (n.statement) html += section('陈述', '<div class="pn-body">' + U.md(n.statement) + '</div>');
      if (n.notes) html += section('说明 / 备注', '<div class="pn-body">' + U.md(n.notes) + '</div>');
      if (n.refs && n.refs.length) {
        html += section('参考', '<div class="pn-body"><ul>' + n.refs.map(function (r) {
          return '<li>' + U.escapeHtml(r) + '</li>';
        }).join('') + '</ul></div>');
      }

      /* 相关连线 */
      var out = [], inc = [], eqs = [], defs = [], users = [], anas = [];
      (g.edgesOf[n.id] || []).forEach(function (e) {
        if (e.kind === 'implication') {
          if (e.target === n.id) inc.push(edgeRow(e, '被推出'));
          else out.push(edgeRow(e, '推出'));
        } else if (e.kind === 'equivalence') {
          eqs.push(edgeRow(e, '等价'));
        } else if (e.kind === 'analogy') {
          anas.push(edgeRow(e, '类比'));
        } else if (e.kind === 'definition') {
          if (e.usedBy === n.id) {
            var d = g.byId[e.definition];
            if (d) defs.push(nodeRow(d, '定义', ''));
          } else {
            users.push(edgeRow(e, '用于'));
          }
        }
      });

      html += section('由本节点推出的结论（' + out.length + '）',
        listOrNone(out, '暂无'));
      html += section('推出本节点的结论（' + inc.length + '）',
        listOrNone(inc, '暂无（可能是原始公理或定义）'));
      html += section('等价命题（' + eqs.length + '）',
        listOrNone(eqs, '暂无'));
      if (anas.length) {
        html += section('类比 / 思想相通（' + anas.length + '）',
          '<div class="pn-hint">⚠️ 弱边：不是逻辑蕴含，只提供联想线索</div>' +
          listOrNone(anas, '暂无'));
      }
      if (MG.config.highlightDefinitions) {
        html += section('陈述中用到的定义（' + defs.length + '）',
          listOrNone(defs, '暂无'));
        if (users.length) {
          html += section('本定义被以下结论引用（' + users.length + '）',
            listOrNone(users, '暂无'));
        }
      }
      bodyEl.innerHTML = html;
    }

    /* -------------------------------------------------------- 连线面板 */
    function renderEdge(e) {
      if (!e) { hide(); return; }
      var g = view.graph;
      var name = T.edgeNames[e.kind] || e.kind;
      var color = e.kind === 'definition' ? '#3C70F5' : '#1C1C1E';
      var html = '';

      html += '<span class="pn-kind" style="background:' + color + '">' +
        '<span class="dot"></span>' + U.escapeHtml(name) + '</span>';
      html += '<h1 class="pn-h1">' + U.escapeHtml(e.title || shortLabel(e, 120)) + '</h1>';
      html += '<div class="pn-h2">' + U.escapeHtml(e.id) + '</div>';

      /* 推导图式 */
      var gph = '';
      if (e.kind === 'implication') {
        gph = e.sources.map(function (id) {
          return '<span class="pn-link" data-kind="node" data-id="' + id + '" style="display:inline-flex;padding:0"><b>' +
            U.escapeHtml(lbl(g, id)) + '</b></span>';
        }).join('<span class="arrow">+</span>') +
          '<span class="arrow">⟹</span>' +
          '<span class="pn-link" data-kind="node" data-id="' + e.target + '" style="display:inline-flex;padding:0"><b>' +
          U.escapeHtml(lbl(g, e.target)) + '</b></span>';
      } else if (e.kind === 'equivalence' || e.kind === 'analogy') {
        gph = '<span class="pn-link" data-kind="node" data-id="' + e.a + '" style="display:inline-flex;padding:0"><b>' +
          U.escapeHtml(lbl(g, e.a)) + '</b></span>' +
          '<span class="arrow">' + (e.kind === 'analogy' ? '～' : '⟺') + '</span>' +
          '<span class="pn-link" data-kind="node" data-id="' + e.b + '" style="display:inline-flex;padding:0"><b>' +
          U.escapeHtml(lbl(g, e.b)) + '</b></span>';
      } else {
        gph = '「<b>' + U.escapeHtml(lbl(g, e.definition)) + '</b>」 出现在 ' +
          '<span class="pn-link" data-kind="node" data-id="' + e.usedBy + '" style="display:inline-flex;padding:0"><b>' +
          U.escapeHtml(lbl(g, e.usedBy)) + '</b></span> 的陈述中';
      }
      html += '<div class="pn-arith">' + gph + '</div>';

      /* 过程：等价线会把「被它遮住的同向箭头」的证明也一并列出来 */
      var steps = [];
      if (e.kind === 'equivalence') {
        (e.proofs || []).forEach(function (p) {
          steps.push({ label: p.label || '', text: p.text || '' });
        });
        if (MG.config.hideParallelImplications) {
          view.graph.edges.forEach(function (o) {
            if (o.kind !== 'implication' || o.sources.length !== 1) return;
            var s = o.sources[0];
            if ((s === e.a && o.target === e.b) || (s === e.b && o.target === e.a)) {
              steps.push({ label: o.title || (lbl(g, s) + ' ⇒ ' + lbl(g, o.target)), text: o.proof || '', tag: '箭头' });
            }
          });
        }
      }

      if (steps.length) {
        html += section('为什么等价', steps.map(function (p, i) {
          return '<div class="pn-step">' +
            '<div class="pn-step-title"><span class="badge">' + (p.tag || (i + 1)) + '</span>' +
            U.escapeHtml(p.label || '') + '</div>' +
            '<div class="pn-body">' + U.md(p.text || '') + '</div></div>';
        }).join(''));
      } else if (e.proof) {
        html += section(e.kind === 'implication' ? '推导过程' : '说明', '<div class="pn-body">' + U.md(e.proof) + '</div>');
      } else if (e.kind === 'definition') {
        var d = g.byId[e.definition];
        html += section('说明', '<div class="pn-body">' +
          U.md(e.note || ('该结论的陈述中使用了定义「' + lbl(g, e.definition) + '」。')) + '</div>');
        if (d && d.statement) {
          html += section('定义原文 · ' + d.label, '<div class="pn-body">' + U.md(d.statement) + '</div>');
        }
      }

      if (e.note && e.proofs) {
        html += '<div class="pn-note">' + U.md(e.note) + '</div>';
      } else if (e.note && e.proof) {
        html += '<div class="pn-note">' + U.md(e.note) + '</div>';
      }

      bodyEl.innerHTML = html;
    }

    /* ----------------------------------------------------------- 事件 */
    bodyEl.addEventListener('click', function (ev) {
      var cchip = ev.target.closest ? ev.target.closest('[data-cluster]') : null;
      if (cchip) {
        hooks.onCluster && hooks.onCluster(cchip.getAttribute('data-cluster'));
        return;
      }
      var chip = ev.target.closest ? ev.target.closest('[data-region]') : null;
      if (chip) {
        hooks.onRegion && hooks.onRegion(chip.getAttribute('data-region'));
        return;
      }
      var row = ev.target.closest ? ev.target.closest('[data-kind][data-id]') : null;
      if (!row) return;
      var kind = row.getAttribute('data-kind');
      var id = row.getAttribute('data-id');
      if (kind === 'node') hooks.onGoto && hooks.onGoto({ type: 'node', id: id });
      else hooks.onGoto && hooks.onGoto({ type: 'edge', id: id });
    });

    closeBtn.addEventListener('click', hide);

    return {
      show: show,
      hide: hide,
      get current() { return current; }
    };
  }

  MG.createPanel = createPanel;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ==========================================================================
   数学星图 · 外部内容包加载器（为「GitHub 多端同步 / PDF 笔记导入」预留）
   --------------------------------------------------------------------------
   页面里写死的 packs（src/data/packs/*.js）是「本地内容」；
   这里负责把「外部内容」也并进来，二者的数据结构完全一样：

     外部目录结构（默认 src/data/external/）：
       external/
         index.json          ← 内容包清单 { "packs": ["my-notes.json", ...] }
         my-notes.json       ← { "name": "…", "nodes": [...], "edges": [...] }

   用 file:// 直接打开网页时浏览器会禁止 fetch，此时静默跳过（不影响使用）；
   想要多端同步 / 导入 PDF 笔记，用本地服务器打开即可：
       python -m http.server 8000      →  http://localhost:8000
   ========================================================================== */
(function (global) {
  'use strict';
  var MG = (global.MG = global.MG || {});

  var DEFAULT_BASE = 'src/data/external/';

  function fetchJSON(url) {
    if (typeof fetch !== 'function') return Promise.resolve(null);
    return fetch(url, { cache: 'no-cache' }).then(function (r) {
      if (!r.ok) return null;
      return r.json();
    }).catch(function () { return null; });
  }

  /**
   * 尝试加载外部内容包。
   * @returns {Promise<{packs: Array, base: string, loaded: number}>}
   */
  function loadExternal(base) {
    base = base || DEFAULT_BASE;
    return fetchJSON(base + 'index.json').then(function (manifest) {
      if (!manifest || !manifest.packs || !manifest.packs.length) {
        return { packs: [], base: base, loaded: 0 };
      }
      return Promise.all(manifest.packs.map(function (f) {
        return fetchJSON(base + f).then(function (p) {
          if (!p) return null;
          p.name = p.name || f;
          return p;
        });
      })).then(function (list) {
        var packs = list.filter(Boolean);
        return { packs: packs, base: base, loaded: packs.length };
      });
    }).catch(function () {
      return { packs: [], base: base, loaded: 0 };
    });
  }

  /** 把任意 JSON 对象当作一个内容包校验（供将来的导入功能使用） */
  function validatePack(p) {
    var errs = [];
    if (!p || typeof p !== 'object') return { ok: false, errs: ['不是对象'] };
    if (!Array.isArray(p.nodes)) errs.push('缺少 nodes 数组');
    if (p.edges && !Array.isArray(p.edges)) errs.push('edges 必须是数组');
    (p.nodes || []).forEach(function (n, i) {
      if (!n.id) errs.push('第 ' + i + ' 个节点缺少 id');
      if (!n.label && !n.title) errs.push('节点 ' + n.id + ' 缺少 label/title');
    });
    return { ok: errs.length === 0, errs: errs };
  }

  MG.loader = {
    loadExternal: loadExternal,
    validatePack: validatePack,
    DEFAULT_BASE: DEFAULT_BASE
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>

        '',
        '**① 舞台：部分选择函数全体**。令',
        '',
        '$$ℱ = { f : f 是函数，dom f ⊆ I，且 ∀i ∈ dom f, f(i) ∈ A_i }$$',

        '',

      ].join('\n'),

    }
  ]
});

/* ==========================================================================

   来自手写笔记「总结：符号测度」第 8 ~ 11 页。

   --------------------------------------------------------------------------
   弱边是**没有逻辑蕴含关系**的「思想相通」。它的用处只有一个：

     卡住了、想找远房灵感的时候，沿着它跳到另一个领域去看看。

   ⚠️ 判据（必须同时满足，否则不要加）：
     ① 两个结论之间**没有**推出 / 等价 / 定义依赖关系（有的话就写成强边）；
     ② 相通之处能一句话说清，而且**说得出具体是什么**（不是「都很难」这种废话）；
     ③ 这个类比**能帮你解决问题**——看到一个，能想起另一个的招。

   写法：{ kind:'analogy', a:'节点id', b:'节点id', title, note }
   强弱由 kind 自动决定（见 config.js 的 theme.edgeStrength），不用手写。
   ========================================================================== */
window.MG = window.MG || {};
(window.MG.packs = window.MG.packs || []).push({

  name: '类比（弱边）',
  nodes: [],

  edges: [

    /* ------------------------------------------------ 证明模板的类比 */
    {
      id: 'ana.sep-container',
      kind: 'analogy',
      a: 'thm.product',

      title: '「幂集造容器 + 分离筛内容」——同一个证明模板',
      note: [
        '这两个证明的骨架**一模一样**，只是塞进去的东西不同：',
        '',
        '**ω 的构造**：先用幂集公理做出 𝒫(I)；再从里面**筛出**所有归纳子集，取交。',
        '',
        '**A × B 的构造**：先用幂集公理做出 𝒫(𝒫(A ∪ B))；再从里面**筛出**那些形如 (a,b) 的元素。',
        '',
        '**共同的招**：集合论里「我想造一个由某种东西组成的集合」时，',
        '永远不能直接写 `{ x : φ(x) }`（那是罗素悖论）。正确的姿势是两步——',
        '**先找一个确定足够大的容器，再用分离公理模式从里面挑**。',
        '',
        '💡 看到「想造一个集合但不知道怎么下手」时，回来想想这两步。'
      ].join('\n')
    },

    /* ------------------------------------------------ 控制无穷的手法 */
    {
      id: 'ana.tame-infinite',
      kind: 'analogy',
      a: 'def.finchar',
      b: 'def.wellorder',
      title: '两种「用有限/最小的东西控制无穷」的手法',
      note: [
        '两个定义都在回答同一个问题：**面对一个无穷对象，怎么下手？**',
        '',
        '**良序**（`def.wellorder`）：要求「每个非空子集都有**最小元**」。',
        '有了最小元，就能做超限归纳、超限递归 —— 把「一步」规范化，无穷就被结构化了。',
        '',
        '**有限特征**（`def.finchar`）：要求「整体属于 𝒜 ⟺ 每个**有限**子集都属于 𝒜」。',
        '于是验证一个无穷对象，只需要逐个检查它的有限片段 —— 无穷被压缩成有限。',
        '',
        '**共同的招**：都不去正面描述无穷，而是找一个**有限的抓手**',
        '（一个最小元 / 一个有限子集），让无穷变得可验证、可操作。',
        '',
        '💡 这个招在数学里到处都是（紧致性、有限生成、可数逼近……）。'
      ].join('\n')
    },

    /* ------------------------------------------------ 筛选条件式的定义 */
    {
      id: 'ana.filter-sieve',
      kind: 'analogy',
      a: 'ax.sep',
      b: 'def.finchar',
      title: '「不描述整体，只给一个筛子」',
      note: [
        '两者都不回答「这个集合里**有什么**」，只回答「**怎么判断**一个东西在不在里面」。',
        '',
        '- 分离公理模式：`x ∈ B ⟺ (x ∈ A ∧ φ(x))` —— 给的是**判定条件**，不是元素清单。',
        '- 有限特征：`X ∈ 𝒜 ⟺ X 的每个有限子集属于 𝒜` —— 同样是判定条件。',
        '',
        '**为什么这个思路重要**：集合常常是无穷的，没法列举；',
        '但只要给出判定条件，「这个元素属不属于」就成了一个可回答的问题。',
        '数学里绝大多数「定义」本质上都是这一类 —— 给条件，不给清单。',
        '',
        '💡 读一个新定义时，先问自己：它给的是**构造**还是**判定条件**？'
      ].join('\n')
    },

    /* ------------------------------------------------ 跨星团的类比 */
    {
      id: 'ana.maximal-apparatus',
      kind: 'analogy',
      a: 'def.finchar',
      b: 'def.vs',
      title: '「有限特征」这个抽象概念，在向量空间里有一个现成的实例',
      note: [
        '严格说这不只是类比 —— 它是一个**实例**，但方向不是逻辑蕴含：',
        '`def.finchar` 不推出 `def.vs`，`def.vs` 也不推出 `def.finchar`；',
        '它们是「抽象工具」和「具体落地」的关系。',
        '',
        '线性无关性恰好是有限特征的：',
        '「S 线性无关 ⟺ S 的每个**有限**子集线性无关」——',
        '这就是 `def.finchar` 的定义，一字不差。',
        '',
        '**所以「每个向量空间有基」的证明里，那个「链的并仍线性无关」的关键一步，',
        '本质上是在验证有限特征在链条下保持。** Tukey 引理正是为此而生的。',
        '',
        '💡 这条边是「跨星团」的：序理论 ↔ 抽象代数。',
        '它不提供新的定理，但它告诉你**两块内容为什么长得像**。'
      ].join('\n')
    }
  ]
});

<script>
/* ==========================================================================
   数学星图 · 应用装配
   --------------------------------------------------------------------------
   把「数据（MG.packs / MG.regions）」与「引擎」接起来：
   建图 → 布局 → 相机 → 渲染 → 交互 → 搜索 → 面板 → 工具条
   ========================================================================== */
(function (global) {
  'use strict';
  var MG = (global.MG = global.MG || {});
  var U = MG.util;
  var C = MG.config;
  var T = MG.theme;
  var GU = MG.graphUtil;

  /* ------------------------------------------------------- KaTeX（可选） */
  /* 若页面里引入了 KaTeX，$…$ 与 $$…$$ 就会自动渲染；没有则原样显示。 */
  function hookKatex() {
    if (typeof global.katex === 'undefined') return;
    MG.renderInlineMath = function (tex) {
      try { return global.katex.renderToString(tex, { throwOnError: false }); }
      catch (e) { return '<code>' + U.escapeHtml(tex) + '</code>'; }
    };
    MG.renderBlockMath = function (tex) {
      try {
        return '<div class="katex-block">' +
          global.katex.renderToString(tex, { displayMode: true, throwOnError: false }) + '</div>';
      } catch (e) { return null; }
    };
  }

  function boot() {
    hookKatex();

    var graphEl = document.getElementById('layer-graph');
    var cloudEl = document.getElementById('layer-cloud');
    var cloudCtx = cloudEl.getContext('2d');
    var searchBox = document.getElementById('search-box');
    var searchInput = document.getElementById('search-input');
    var searchResults = document.getElementById('search-results');
    var toolbar = document.getElementById('toolbar');
    var legendEl = document.getElementById('legend');
    var panelEl = document.getElementById('panel');
    var panelBody = document.getElementById('panel-body');
    var panelClose = document.getElementById('panel-close');
    var hintEl = document.getElementById('hint');

    /* ------------------------------------------------------------ 建图 */
    var localPacks = (MG.packs || []).slice();
    var graph = MG.buildGraph(localPacks, MG.regions, MG.clusters);
    MG.computeLayout(graph);
    if (graph.warnings.length) {
      console.warn('[数学星图] 数据校验提示：\n' + graph.warnings.join('\n'));
    }

    /* ------------------------------------------------------------ 状态 */
    var view = {
      graph: graph,
      cam: null,
      visible: MG.graphUtil.visibleEdges(graph),
      focus: null,
      hover: null
    };
    var cam = MG.createCamera();
    view.cam = cam;

    var renderer = MG.createRenderer(graphEl, view);
    var cloudTex = null;
    var dpr = 1;
    var rafId = 0;
    var dirty = true;

    /* -------------------------------------------------------- 绘制循环 */
    function requestDraw() {
      dirty = true;
      if (!rafId) rafId = requestAnimationFrame(frame);
    }

    function frame() {
      rafId = 0;
      var animating = cam.tick();
      if (dirty || animating) {
        MG.background.draw(cloudCtx, cam, cloudTex, dpr);
        renderer.draw();
        dirty = false;
      }
      if (animating) requestDraw();
    }

    /* ------------------------------------------------------------ 尺寸 */
    function resize() {
      var s = renderer.resize();
      dpr = s.dpr;
      cloudEl.width = Math.round(s.w * dpr);
      cloudEl.height = Math.round(s.h * dpr);
      requestDraw();
    }
    global.addEventListener('resize', resize);

    /* -------------------------------------------------- 聚焦 / 面板 */
    var panelOpen = false;

    /** 面板遮住的屏幕区域：宽屏是右侧抽屉，窄屏是底部抽屉 */
    function panelInset() {
      if (!panelOpen) return { x: 0, y: 0 };
      if (global.innerWidth > 820) return { x: 414, y: 0 };
      return { x: 0, y: Math.min(cam.viewH * 0.62, Math.max(80, cam.viewH - 120)) };
    }

    /** 把一个世界坐标点换算成「可见区正中」所需的相机中心 */
    function centerTargetFor(pt, k) {
      k = k || cam.k;
      var inset = panelInset();
      return { cx: pt.x + (inset.x / 2) / k, cy: pt.y + (inset.y / 2) / k };
    }

    function focusNode(id, opts) {
      opts = opts || {};
      if (view.focus && view.focus.type === 'node' && view.focus.id === id && !opts.force) {
        clearFocus();       // 再点一次同一个节点 = 取消聚焦
        panel.hide();
        return;
      }
      view.focus = { type: 'node', id: id };
      panel.show({ type: 'node', id: id });
      panelOpen = true;
      if (opts.center !== false) centerOn(id);
      requestDraw();
      hideHint();
    }

    function focusEdge(id, opts) {
      opts = opts || {};
      view.focus = { type: 'edge', id: id };
      panel.show({ type: 'edge', id: id });
      panelOpen = true;
      var e = findEdge(id);
      if (e && opts.center !== false) {
        var pts = MG.graphUtil.edgeNodes(e);
        var mid = { x: 0, y: 0 }, cnt = 0;
        pts.forEach(function (nid) {
          var nd = graph.byId[nid];
          if (nd) { mid.x += nd.x; mid.y += nd.y; cnt++; }
        });
        if (cnt) { mid.x /= cnt; mid.y /= cnt; ensureCenter(mid); }
      }
      requestDraw();
      hideHint();
    }

    function findEdge(id) {
      for (var i = 0; i < graph.edges.length; i++) if (graph.edges[i].id === id) return graph.edges[i];
      return null;
    }

    function clearFocus() {
      view.focus = null;
      requestDraw();
    }

    /** 若某个点不在安全视野内，平滑移到中心（避开右侧面板） */
    function centerOn(id) {
      var n = graph.byId[id];
      if (n) ensureCenter(n);
    }

    function ensureCenter(pt) {
      var inset = panelInset();
      var p = cam.toScreen(pt.x, pt.y);
      var outside = p.x < 90 || p.x > cam.viewW - 90 - inset.x ||
        p.y < 110 || p.y > cam.viewH - 90 - inset.y;
      if (!outside) return;
      cam.animateTo(centerTargetFor(pt));
    }

    function bboxOf(list) {
      var bb = { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity };
      list.forEach(function (n) {
        bb.minX = Math.min(bb.minX, n.x); bb.maxX = Math.max(bb.maxX, n.x);
        bb.minY = Math.min(bb.minY, n.y); bb.maxY = Math.max(bb.maxY, n.y);
      });
      return bb;
    }

    /** 让一个世界矩形铺满可视区（右侧留给面板），返回相机目标 */
    function targetFor(bb, padding, maxZoom) {
      var inset = panelInset();
      // 小屏幕上把留白收窄，否则整张图会缩得看不动
      var pad = Math.min(padding, Math.min(cam.viewW, cam.viewH) * 0.18);
      var w = Math.max(40, bb.maxX - bb.minX);
      var h = Math.max(40, bb.maxY - bb.minY);
      var availW = Math.max(80, cam.viewW - pad * 2 - inset.x);
      var availH = Math.max(80, cam.viewH - pad * 2 - inset.y);
      var k = U.clamp(Math.min(availW / w, availH / h),
        Math.max(C.camera.minZoom, C.camera.fitMinZoom),
        Math.min(C.camera.maxZoom, maxZoom == null ? C.camera.maxFitZoom : maxZoom));
      var base = centerTargetFor({ x: (bb.minX + bb.maxX) / 2, y: (bb.minY + bb.maxY) / 2 }, k);
      return { k: k, cx: base.cx, cy: base.cy };
    }

    /** 适配到某个星系 */
    function fitRegion(rid) {
      var list = graph.nodes.filter(function (n) { return n.regions.indexOf(rid) >= 0; });
      if (!list.length) return;
      cam.animateTo(targetFor(bboxOf(list), 170, 1.35));
      requestDraw();
    }

    /** 适配到某个星团 */
    function fitCluster(cid) {
      var c = graph.clusterById[cid];
      if (!c || !c.nodes || !c.nodes.length) return;
      cam.animateTo(targetFor(bboxOf(c.nodes), 190, 1.7));
      requestDraw();
    }

    function fitAll() {
      cam.animateTo(targetFor(graph.bbox(), C.camera.fitPadding));
      requestDraw();
    }

    /* ---------------------------------------------------------- 面板 */
    var panel = MG.createPanel(panelEl, panelBody, panelClose, view, {
      onGoto: function (hit) {
        if (hit.type === 'node') focusNode(hit.id, { force: true });
        else focusEdge(hit.id, { force: true });
      },
      onRegion: function (rid) { fitRegion(rid); },
      onCluster: function (cid) { fitCluster(cid); },
      onClose: function () { panelOpen = false; requestDraw(); }
    });

    /* ---------------------------------------------------------- 交互 */
    MG.createInteraction(graphEl, view, {
      draw: function () { requestDraw(); },
      hitTest: function (x, y) { return renderer.hitTest(x, y); },
      onPick: function (hit) {
        if (!hit) {            // 点空白：回到全图并收起面板
          clearFocus();
          panel.hide();
          return;
        }
        if (hit.type === 'node') focusNode(hit.id);
        else focusEdge(hit.id);
      },
      onHover: function () { hideHintSoon(); }
    });

    /* ---------------------------------------------------------- 搜索 */
    var search = MG.createSearch(searchBox, searchInput, searchResults, view, {
      onNode: function (id) { focusNode(id, { force: true }); },
      onRegion: function (rid) { fitRegion(rid); }
    });
    search.reindex();

    /* -------------------------------------------------------- 工具条 */
    toolbar.addEventListener('click', function (e) {
      var btn = e.target.closest ? e.target.closest('button') : null;
      if (!btn) return;
      var act = btn.getAttribute('data-act');
      if (act === 'zoom-in') { cam.zoomBy(C.camera.zoomStep); requestDraw(); }
      else if (act === 'zoom-out') { cam.zoomBy(1 / C.camera.zoomStep); requestDraw(); }
      else if (act === 'fit') { fitAll(); requestDraw(); }
      else if (act === 'toggle-defs') {
        C.showDefinitionLines = !C.showDefinitionLines;
        btn.classList.toggle('on', C.showDefinitionLines);
        refreshVisible();
      } else if (act === 'toggle-explore') {
        C.exploreMode = !C.exploreMode;
        btn.classList.toggle('on', C.exploreMode);
        renderLegend();
        requestDraw();
      } else if (act === 'toggle-labels') {
        C.showLabels = !C.showLabels;
        btn.classList.toggle('on', C.showLabels);
        requestDraw();
      } else if (act === 'toggle-wheel') {
        C.wheelZooms = !C.wheelZooms;
        btn.classList.toggle('on', C.wheelZooms);
        btn.textContent = C.wheelZooms ? '滚轮·缩放' : '滚轮·平移';
      }
    });

    function refreshVisible() {
      view.visible = MG.graphUtil.visibleEdges(graph);
      renderer.invalidate();
      requestDraw();
    }

    /* ---------------------------------------------------------- 图例 */
    function renderLegend() {
      var regions = graph.regions || [];
      var types = T.typeOrder || Object.keys(T.nodeTypes || {});
      var live = regions.filter(function (r) { return r.stat; });
      var typeRows = types.filter(function (t) { return T.nodeTypes[t]; }).map(function (t) {
        var st = T.nodeTypes[t];
        return '<span class="lg-item"><span class="lg-dot" style="background:' + st.color + '"></span>' + st.name + '</span>';
      }).join('');

      var weakCount = graph.edges.filter(function (e) { return GU.isWeak(e); }).length;
      var edgeRows =
        '<span class="lg-item"><span class="lg-line" style="border-top-color:#1C1C1E;border-top-width:2px"></span>等价<em style="color:#A5ABB3;font-style:normal">·强</em></span>' +
        '<span class="lg-item"><span class="lg-line" style="border-top-color:#1C1C1E;border-top-width:2px"></span>推出 →<em style="color:#A5ABB3;font-style:normal">·强</em></span>' +
        '<span class="lg-item"><span class="lg-line" style="border-top-color:rgba(60,112,245,.5);border-top-width:2px"></span>定义引用<em style="color:#A5ABB3;font-style:normal">·强</em></span>' +
        (weakCount
          ? '<span class="lg-item" style="opacity:' + (C.exploreMode ? 1 : 0.45) + '">' +
            '<span class="lg-line" style="border-top-color:rgba(138,106,214,.7);border-top-width:2px;border-top-style:dashed"></span>' +
            '类比<em style="color:#A5ABB3;font-style:normal">·弱 ' + weakCount + ' 条' +
            (C.exploreMode ? '' : '（点右上角「探索」显示）') + '</em></span>'
          : '');

      // 星系 + 它下面的星团（缩进一层）
      var regionRows = live.map(function (r) {
        var mine = graph.clusters.filter(function (c) { return c.parent === r.id && c.stat; });
        var head = '<span class="lg-item" data-region="' + r.id + '" style="cursor:pointer">' +
          '<span class="lg-swatch" style="background:' + U.mixWithWhite(r.color, 0.45) + '"></span>' +
          '<b style="font-weight:600">' + r.name + '</b>' +
          '<span style="color:#A5ABB3">·' + r.stat.count + '</span></span>';
        if (!mine.length) return head;
        var kids = mine.map(function (c) {
          return '<span class="lg-item" data-cluster="' + c.id + '" style="cursor:pointer">' +
            '<span class="lg-swatch" style="background:' + U.mixWithWhite(c.color || r.color, 0.62) +
            ';width:11px;height:11px;border-radius:50%"></span>' +
            c.name + '<span style="color:#A5ABB3">·' + c.stat.count + '</span></span>';
        }).join('');
        return head + '<span class="lg-kids">' + kids + '</span>';
      }).join('');

      legendEl.innerHTML =
        '<div class="lg-head" data-toggle><b>图例</b><span class="lg-caret">▼</span></div>' +
        '<div class="lg-body">' +
        '<div class="lg-group"><div class="lg-title">节点（' + graph.nodes.length + '）</div><div class="lg-row">' + typeRows + '</div></div>' +
        '<div class="lg-group"><div class="lg-title">连线（' + graph.edges.length + '）</div><div class="lg-row">' + edgeRows + '</div></div>' +
        '<div class="lg-group"><div class="lg-title">数学板块</div><div class="lg-row">' + regionRows + '</div></div>' +
        '</div>';
    }

    legendEl.addEventListener('click', function (e) {
      if (e.target.closest && e.target.closest('[data-toggle]')) {
        legendEl.classList.toggle('collapsed');
        return;
      }
      var cchip = e.target.closest ? e.target.closest('[data-cluster]') : null;
      if (cchip) { fitCluster(cchip.getAttribute('data-cluster')); return; }
      var chip = e.target.closest ? e.target.closest('[data-region]') : null;
      if (chip) fitRegion(chip.getAttribute('data-region'));
    });

    /* ---------------------------------------------------------- 键盘 */
    document.addEventListener('keydown', function (e) {
      var tag = (e.target.tagName || '').toLowerCase();
      var typing = tag === 'input' || tag === 'textarea' || e.target.isContentEditable;
      if (e.key === 'Escape') {
        if (typing) return;
        search.close();
        panel.hide();
        clearFocus();
        return;
      }
      if (typing) return;
      if (e.key === '/' ) { e.preventDefault(); search.focus(); return; }
      if (e.key === '+' || e.key === '=') { e.preventDefault(); cam.zoomBy(C.camera.zoomStep); requestDraw(); }
      else if (e.key === '-' || e.key === '_') { e.preventDefault(); cam.zoomBy(1 / C.camera.zoomStep); requestDraw(); }
      else if (e.key === '0') { e.preventDefault(); fitAll(); requestDraw(); }
      else if (e.key.indexOf('Arrow') === 0) {
        e.preventDefault();
        var step = 90;
        if (e.key === 'ArrowLeft') cam.panBy(step, 0);
        if (e.key === 'ArrowRight') cam.panBy(-step, 0);
        if (e.key === 'ArrowUp') cam.panBy(0, step);
        if (e.key === 'ArrowDown') cam.panBy(0, -step);
        cam.stopAnimation();
        requestDraw();
      }
    });

    /* ------------------------------------------------------------ 提示 */
    var hintTimer = null, hintGone = false;
    function hideHint() { if (!hintGone) { hintGone = true; hintEl.classList.add('fade'); } }
    function hideHintSoon() {
      if (hintTimer || hintGone) return;
      hintTimer = setTimeout(hideHint, 9000);
    }
    hideHintSoon();

    /* ------------------------------------------------------------ 启动 */
    /** 深链：#n=<节点id>  #e=<连线id>  #r=<星系id>  #c=<星团id> */
    function applyHash() {
      var h = String(global.location.hash || '').replace(/^#/, '');
      var m = h.match(/^([necr])=(.+)$/);
      if (!m) return false;
      var id = decodeURIComponent(m[2]).trim();
      if (m[1] === 'n' && graph.byId[id]) { focusNode(id, { force: true }); return true; }
      if (m[1] === 'e' && findEdge(id)) { focusEdge(id, { force: true }); return true; }
      if (m[1] === 'r' && graph.regionById[id]) { fitRegion(id); return true; }
      if (m[1] === 'c' && graph.clusterById[id] && graph.clusterById[id].nodes.length) {
        fitCluster(id); return true;
      }
      return false;
    }

    function start() {
      resize();
      cloudTex = MG.background.buildTexture(graph);
      renderLegend();
      var bb = graph.bbox();
      cam.fit(bb, C.camera.fitPadding);
      var fitK = cam.k;
      var cx = (bb.minX + bb.maxX) / 2, cy = (bb.minY + bb.maxY) / 2;
      if (!applyHash()) {
        // 初始视角：先稍微留白，再平滑推进到「全部适配」
        cam.k = fitK * 0.72;
        cam.centerOn(cx, cy);
        cam.animateTo({ k: fitK, cx: cx, cy: cy }, 700);
      }
      requestDraw();
    }

    start();

    /* ------------------------------------------------ 外部内容包（可选） */
    if (MG.loader) {
      MG.loader.loadExternal().then(function (res) {
        if (!res || !res.packs.length) return;
        res.packs.forEach(function (p) {
          var v = MG.loader.validatePack(p);
          if (!v.ok) { console.warn('[数学星图] 外部内容包有问题：', p.name, v.errs); }
        });
        var packs = localPacks.concat(res.packs);
        graph = MG.buildGraph(packs, MG.regions, MG.clusters);
        MG.computeLayout(graph);
        view.graph = graph;
        view.visible = MG.graphUtil.visibleEdges(graph);
        renderer.invalidate();
        cloudTex = MG.background.buildTexture(graph);
        search.reindex();
        renderLegend();
        start();
        console.info('[数学星图] 已并入 ' + res.loaded + ' 个外部内容包。');
      });
    }

    /* 方便在控制台里调试：MG.app.graph / MG.app.cam */
    MG.app = {
      view: view, cam: cam, renderer: renderer, search: search,
      focusNode: focusNode, focusEdge: focusEdge, fitAll: fitAll, fitRegion: fitRegion,
      clearFocus: clearFocus,
      requestDraw: requestDraw,     // 外部改了 cam / 数据之后记得调一次
      rebuild: function () { start(); },
      get graph() { return view.graph; },
      get packs() { return (MG.packs || []); }
    };
  }

  /* ------------------------------------------------------ 出错时的兜底 */
  /* 万一某个数据包写错了，至少让人看见「哪儿错了」，而不是一片白屏。 */
  function fatal(err) {
    console.error('[数学星图] 启动失败：', err);
    if (typeof global.__mgFatal === 'function') { global.__mgFatal(err); return; }
    if (document.getElementById('mg-fatal')) return;
    var box = document.createElement('div');
    box.id = 'mg-fatal';
    box.style.cssText =
      'position:fixed;inset:auto 16px 16px 16px;max-height:50vh;overflow:auto;z-index:99;' +
      'background:#fff;border:1px solid rgba(200,60,60,.35);border-left:3px solid #D0483C;' +
      'border-radius:10px;padding:14px 16px;box-shadow:0 12px 40px rgba(0,0,0,.16);' +
      'font:12.5px/1.6 ui-monospace,Menlo,Consolas,monospace;color:#3a2020;white-space:pre-wrap';
    box.textContent = '数学星图启动出错（多半是某个内容包写错了）：\n\n' +
      ((err && (err.stack || err.message)) || String(err));
    document.body.appendChild(box);
  }

  function safeBoot() {
    try { boot(); } catch (err) { fatal(err); }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', safeBoot);
  } else {
    safeBoot();
  }
})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body>
</html>
